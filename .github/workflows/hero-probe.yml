name: hero-probe
# Watches the beingsteady.com live taster. On failure → WhatsApp alert to Hayat.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe hero endpoints
        id: probe
        run: |
          set +e
          FAILS=""
          page=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://beingsteady.com)
          [ "$page" = "200" ] || FAILS="$FAILS page=$page"
          health=$(curl -s -m 20 https://beingsteady.com/api/hero-session)
          echo "$health" | grep -q '"ok":true' || FAILS="$FAILS health=$health"
          mint=$(curl -s -m 25 -X POST -H "Origin: https://beingsteady.com" https://beingsteady.com/api/hero-session)
          echo "$mint" | grep -q '"secret":"ek_\|"error":"budget"' || FAILS="$FAILS mint=$(echo $mint | head -c 120)"
          if [ -n "$FAILS" ]; then
            echo "fails=$FAILS" >> "$GITHUB_OUTPUT"
            echo "status=down" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi
      - name: WhatsApp alert
        if: steps.probe.outputs.status == 'down'
        env:
          DSN: ${{ secrets.UNIPILE_DSN }}
          KEY: ${{ secrets.UNIPILE_API_KEY }}
          CHAT: ${{ secrets.WA_CHAT_ID }}
        run: |
          curl -s -X POST "$DSN/api/v1/chats/$CHAT/messages" \
            -H "X-API-KEY: $KEY" \
            -F "text=🚨 beingsteady.com hero taster is DOWN: ${{ steps.probe.outputs.fails }} (hero-probe cron)"
